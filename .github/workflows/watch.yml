name: Tennis night availability
on:
  push:
    branches: [main]
    paths: ['watch.py', 'requirements.txt', '.github/workflows/watch.yml']
  schedule:
    # 日本時間09:02〜17:57、18:02・18:07。対象日・終了時刻で制限。
    - cron: '2-59/5 0-8 * * *'
    - cron: '2,7 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=空き確認のみ / test-email=メールテスト / monitor=確認と通知'
        type: choice
        default: check
        options:
          - check
          - test-email
          - monitor
permissions:
  contents: read
concurrency:
  group: tennis-night-watch
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    # 公開リポジトリの標準ランナーを使用。
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check activation date and cutoff
        id: gate
        env:
          RUN_MODE: ${{ github.event_name == 'push' && 'check' || inputs.mode || 'monitor' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from watch import monitoring_active
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          active = os.environ['RUN_MODE'] == 'test-email' or monitoring_active(now)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          print('本日の指定終了時刻まで監視対象' if active else '監視停止：サイトへの確認は行いません')
          PY
      - name: Restore last result
        if: steps.gate.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tennis-state-
      - name: Install browser
        if: steps.gate.outputs.active == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check and notify
        if: steps.gate.outputs.active == 'true'
        env:
          SMTP_USER: ${{ secrets.TENNISU }}
          SMTP_PASSWORD: ${{ secrets.TENISU3 }}
          NOTIFY_TO: ${{ secrets.TENISU2 }}
          RUN_MODE: ${{ github.event_name == 'push' && 'check' || inputs.mode || 'monitor' }}
        run: |
          case "$RUN_MODE" in
            check) python watch.py --once ;;
            test-email) python watch.py --test-email ;;
            monitor) python watch.py --scheduled ;;
            *) exit 1 ;;
          esac
      - name: Save last result
        if: success() && steps.gate.outputs.active == 'true' && github.event_name != 'push' && (github.event_name == 'schedule' || inputs.mode == 'monitor')
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}-${{ github.run_attempt }}
